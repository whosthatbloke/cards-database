name: Build Docker image

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build TCGdex Server
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USER }}/tcgdex
    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch full history for `updated` support
          fetch-depth: 0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pre build server
        run: |
          bun install --frozen-lockfile
          cd server
          bun install --frozen-lockfile
          bun run compile
          rm -rf node_modules
          cd ..
          rm -rf node_modules

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: ./Dockerfile.github-actions
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          push: ${{ github.event_name != 'pull_request' }}
          cache-to: type=gha,mode=max

      - name: Report immutable image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          printf '%s@%s\n' "${IMAGE_NAME}" "${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
